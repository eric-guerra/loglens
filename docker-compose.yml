services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 10s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.1
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports: ["5601:5601"]
    depends_on: [elasticsearch]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # Ships sample/host logs into the Redis broker list, as Logstash shippers do in production.
  shipper:
    image: docker.elastic.co/logstash/logstash:8.14.1
    volumes:
      - ./logstash/shipper.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./samples:/samples:ro
    depends_on: [redis]

  setup:
    image: curlimages/curl:8.8.0
    volumes: ["./elasticsearch:/es:ro"]
    entrypoint: ["sh", "/es/setup.sh"]
    depends_on:
      elasticsearch: { condition: service_healthy }

  loglens:
    build: .
    environment:
      REDIS_URL: redis://redis:6379
      ES_URL: http://elasticsearch:9200
      LOGLENS_WORKERS: "4"
    ports: ["9100:9100"]
    depends_on: [redis, setup]
