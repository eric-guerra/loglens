# Lightweight shipper: tail files and push raw lines onto the Redis broker.
# Parsing happens centrally in LogLens, so shippers stay cheap on application hosts.
input {
  file {
    path => ["/samples/*.log"]
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  mutate {
    rename => { "[log][file][path]" => "source" }
    remove_field => ["@version", "event", "host"]
  }
}

output {
  redis {
    host => "redis"
    data_type => "list"
    key => "logs:incoming"
    batch => true
    batch_events => 200
    codec => json
  }
}
